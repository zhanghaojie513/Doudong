name: build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

env:
  DOTNET_NOLOGO: true
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true

jobs:
  build-test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          # 与 global.json 一致；那里固定了 SDK 版本并启用 Microsoft.Testing.Platform 运行器。
          dotnet-version: '10.0.402'

      - name: Restore
        run: dotnet restore Dougong.slnx

      - name: Build
        run: dotnet build Dougong.slnx -c Release --no-restore

      # 测试栈是 xUnit v3 + Microsoft.Testing.Platform。
      # 不能用 VSTest 的 `--logger "console;verbosity=normal"`：MTP 不接受该参数，
      # 表现为「Zero tests ran」+ Handshake failures（退出码 5）——
      # 看起来像测试挂了，实际一个测试都没跑起来。
      # MTP 的等价参数是 `--output Detailed`。
      - name: Test
        run: dotnet test Dougong.slnx -c Release --no-build --output Detailed

      # 偶发失败已被观察到一次，重试一次以区分 flaky 与真失败；
      # 重试仍失败则说明是真实回归。
      - name: Test (retry on flake)
        if: failure()
        run: dotnet test Dougong.slnx -c Release --no-build --output Detailed

      - name: Pack (verify packaging works)
        run: dotnet pack Dougong.slnx -c Release --no-build -o artifacts/packages

      - name: Upload packages
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: packages
          path: artifacts/packages
          if-no-files-found: ignore
