name: build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

env:
  DOTNET_NOLOGO: true
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true

jobs:
  build-test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          # 与 README「环境要求」一致；global.json 尚未固定，因此显式指定
          dotnet-version: '10.0.x'

      - name: Restore
        run: dotnet restore Dougong.slnx

      - name: Build
        run: dotnet build Dougong.slnx -c Release --no-restore

      # 偶发失败已被观察到一次，重试一次以区分 flaky 与真失败；
      # 重试仍失败则说明是真实回归。
      - name: Test
        run: dotnet test Dougong.slnx -c Release --no-build --logger "console;verbosity=normal"

      - name: Test (retry on flake)
        if: failure()
        run: dotnet test Dougong.slnx -c Release --no-build --logger "console;verbosity=normal"

      - name: Pack (verify packaging works)
        run: dotnet pack Dougong.slnx -c Release --no-build -o artifacts/packages

      - name: Upload packages
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: packages
          path: artifacts/packages
          if-no-files-found: ignore
